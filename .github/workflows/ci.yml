name: PTCG AI Battle CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov fastapi uvicorn psutil

    - name: Run Unit Tests & Scenario Suite
      run: |
        pytest tests/ -v

    - name: Run Performance Benchmark Smoke Test
      run: |
        python tools/benchmark.py --games 5

    - name: Test Submission Packaging
      run: |
        chmod +x tools/build_submission.sh
        ./tools/build_submission.sh
